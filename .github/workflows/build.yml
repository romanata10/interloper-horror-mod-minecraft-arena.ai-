name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build mod jar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          echo "=== compiler errors ==="
          grep -n -E "error:|error;|\.java:[0-9]+" build.log | head -60 || true
          exit $STATUS

      - name: Compile error summary
        if: failure()
        shell: bash
        run: |
          {
            echo "### Compile errors"
            echo '```'
            grep -n -E "error:" build.log | head -60 || true
            echo '```'
            echo "### Tail"
            echo '```'
            tail -30 build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload jar artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: interloper-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
