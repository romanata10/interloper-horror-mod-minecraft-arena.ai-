name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build mod jar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report build log chunk 1
        if: failure()
        run: python3 -c "import pathlib;d=pathlib.Path('build.log').read_text(errors='replace');print('::error::'+d[-6000:].replace(chr(13),'').replace(chr(10),'%0A'))"

      - name: Report build log chunk 2
        if: failure()
        run: python3 -c "import pathlib,re;d=pathlib.Path('build.log').read_text(errors='replace');lines=[l for l in d.splitlines() if re.search(r'(?i)error|failed|caused by|could not|what went wrong', l)][:40];print('::error::'+'%0A'.join(lines).replace(chr(13),''))"

      - name: Show artifacts
        run: ls -lh build/libs

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: interloper-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
