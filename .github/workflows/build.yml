name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build mod jar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          echo "=== compiler errors ==="
          grep -n -E "error:|error;|\.java:[0-9]+" build.log | head -60 || true
          exit $STATUS

      - name: Compile error summary
        if: failure()
        shell: bash
        run: |
          set +e
          grep -n "error:" build.log | head -10 | while IFS= read -r line; do
            echo "::error title=javac::$(echo "$line" | head -c 900)"
          done
          echo "::warning title=errors::$(grep -c "error:" build.log) javac errors in log"
          CLEAN=$(grep -v -E '^\s+at |^\s*$|^\s*\.\.\. [0-9]+ more' build.log | tail -25 | tr '\n' '|')
          echo "::error title=gradle-tail::$(echo "$CLEAN" | head -c 8000)"
          {
            echo "### gradle log tail"
            echo '```'
            grep -v -E '^\s+at ' build.log | tail -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect jar
        if: success()
        shell: bash
        run: |
          set -e
          JAR=$(ls build/libs/interloper-*.jar | head -1)
          echo "::notice title=jar::$JAR ($(du -h "$JAR" | cut -f1), $(unzip -l "$JAR" | tail -1 | awk '{print $2}') entries)"
          unzip -l "$JAR" | tail -3

      - name: Validate jar contents
        if: success()
        shell: bash
        run: |
          set -e
          JAR=$(ls build/libs/interloper-*.jar | head -1)
          FAIL=0
          for f in \
            META-INF/mods.toml \
            assets/interloper/lang/en_us.json \
            assets/interloper/lang/ru_ru.json \
            assets/interloper/textures/entity/interloper.png \
            assets/interloper/textures/entity/interloper_corrupt.png \
            assets/interloper/textures/entity/corrupted_npc.png \
            assets/interloper/textures/entity/crasher.png \
            assets/interloper/textures/entity/vrad.png \
            assets/interloper/textures/entity/cone.png \
            assets/interloper/textures/entity/dmnpc.png \
            assets/interloper/textures/entity/skyghost_skin.png \
            assets/interloper/textures/block/source_floor.png \
            assets/interloper/textures/item/console.png \
            assets/interloper/models/item/console.json \
            assets/interloper/models/block/source_floor.json \
            assets/interloper/blockstates/source_floor.json \
            data/interloper/dimension/source_void.json \
            data/interloper/dimension/xbox_360_dreams.json \
            data/interloper/dimension/white_door_bsp.json \
            data/interloper/dimension/skybox.json \
            data/interloper/dimension_type/skybox.json \
            data/interloper/worldgen/biome/skybox.json \
            data/interloper/advancements/skybox_active.json \
            data/interloper/recipes/void_probe.json \
            data/interloper/recipes/dm_editor.json \
            data/interloper/recipes/ravencheck.json \
            data/interloper/recipes/skybox_exe.json \
            assets/interloper/blockstates/graffiti.json \
            assets/interloper/blockstates/ravencheck.json \
            assets/interloper/models/block/graffiti.json \
            assets/interloper/models/block/ravencheck.json \
            assets/interloper/textures/block/graffiti.png \
            assets/interloper/textures/block/ravencheck.png \
            assets/interloper/textures/entity/void_probe.png \
            assets/interloper/textures/entity/white_cube.png \
            assets/interloper/textures/item/source_box.png \
            assets/interloper/textures/item/flashlight_nuke.png \
            assets/interloper/textures/item/skybox_exe.png \
            assets/interloper/models/item/void_probe.json \
            assets/interloper/models/item/dm_editor.json \
            assets/interloper/models/item/source_box.json \
            assets/interloper/models/item/skybox_exe.json \
            data/interloper/dimension_type/source_void.json \
            data/interloper/dimension_type/xbox_360_dreams.json \
            data/interloper/dimension_type/white_door_bsp.json \
            data/interloper/worldgen/biome/source_void.json \
            data/interloper/worldgen/biome/xbox_360_dreams.json \
            data/interloper/worldgen/biome/white_door_bsp.json \
            data/interloper/forge/biome_modifier/add_void_mob_spawns.json \
            assets/interloper/blockstates/missing_texture.json \
            assets/interloper/blockstates/white_door.json \
            assets/interloper/blockstates/xbox_grass.json \
            assets/interloper/blockstates/fall_hole.json \
            assets/interloper/textures/block/fall_hole.png \
            assets/interloper/textures/block/missing_texture.png \
            assets/interloper/textures/block/xbox_grass.png \
            assets/interloper/textures/block/portal_panel.png \
            assets/interloper/textures/entity/broken_scientist.png \
            assets/interloper/textures/item/interloper_umbrella.png \
            assets/interloper/textures/item/white_door_key.png \
            assets/interloper/models/item/interloper_umbrella.json \
            data/interloper/damage_type/interloped.json \
            net/anomidae/interloper/Interloper.class \
            net/anomidae/interloper/item/ConsoleItem.class \
            net/anomidae/interloper/client/screen/ConsoleScreen.class \
            net/anomidae/interloper/entity/InterloperEntity.class \
            net/anomidae/interloper/entity/InterloperCorruptEntity.class \
            net/anomidae/interloper/entity/CorruptedNpcEntity.class \
            net/anomidae/interloper/entity/VradEntity.class \
            net/anomidae/interloper/entity/CrasherEntity.class \
            net/anomidae/interloper/entity/ConeEntity.class \
            net/anomidae/interloper/entity/DmNpcEntity.class \
            net/anomidae/interloper/entity/SkyghostEntity.class \
            net/anomidae/interloper/world/SourceVoid.class \
            net/anomidae/interloper/world/XboxDreams.class \
            net/anomidae/interloper/world/WhiteDoor.class \
            net/anomidae/interloper/world/Dimensions.class \
            net/anomidae/interloper/world/XboxFabricator.class \
            net/anomidae/interloper/entity/BrokenCharacterEntity.class \
            net/anomidae/interloper/item/InterloperUmbrellaItem.class \
            net/anomidae/interloper/block/WhiteDoorBlock.class \
            net/anomidae/interloper/block/GraffitiBlock.class \
            net/anomidae/interloper/block/RavenCheckBlock.class \
            net/anomidae/interloper/entity/VoidProbeEntity.class \
            net/anomidae/interloper/entity/WhiteCubeEntity.class \
            net/anomidae/interloper/item/VoidProbeItem.class \
            net/anomidae/interloper/item/DmEditorItem.class \
            net/anomidae/interloper/item/FlashlightNukeItem.class \
            net/anomidae/interloper/item/SourceBoxItem.class \
            net/anomidae/interloper/item/SkyboxExeItem.class \
            net/anomidae/interloper/world/SkyboxDimension.class \
            net/anomidae/interloper/world/SkyboxState.class \
            net/anomidae/interloper/world/SkyboxWatcher.class \
            net/anomidae/interloper/world/Graffiti.class \
            net/anomidae/interloper/world/StreetFabricator.class \
            net/anomidae/interloper/world/UnderBedrock.class ; do
            if ! unzip -l "$JAR" "$f" > /dev/null 2>&1; then
              echo "::error title=missing::$f"
              FAIL=1
            fi
          done
          unzip -p "$JAR" META-INF/mods.toml | grep -q 'modId="interloper"' || { echo "::error title=mods.toml::modId missing"; FAIL=1; }
          exit $FAIL

      - name: Upload jar artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: interloper-jar
          path: build/libs/interloper-*.jar
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/interloper-*.jar
          generate_release_notes: true

  smoke-server:
    name: Dedicated server smoke test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run dedicated server for a while
        shell: bash
        run: |
          set +e
          chmod +x ./gradlew
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-name=smoke\nspawn-protection=0\ngenerate-structures=false\nsync-chunk-writes=false\n' > run/server.properties
          timeout 360 ./gradlew runServer --no-daemon 2>&1 | tee server.log
          echo "=== interesting log lines ==="
          grep -n -E "Done \\(|Exception|Caused by|Failed|ERROR|error" server.log | grep -v -E "at |SLF4J|log4j" | head -30
          echo "=== mod load check ==="
          grep -c "INTERLOPER" server.log || true
          if ! grep -q "Done (" server.log; then
            echo "::error title=server::dedicated server did not finish starting"
            grep -n -E "Exception|Caused by|Failed|ERROR" server.log | head -10 | while IFS= read -r line; do
              echo "::error title=server::$line"
            done
            exit 1
          fi
          if grep -q -E "Failed to load mod|Missing or unsupported|Exception in server tick loop" server.log; then
            echo "::error title=server::server reported a fatal problem"
            exit 1
          fi
          echo "=== mod self-check ==="
          grep "\[interloper\]" server.log | head -20 || true
          for dim in source_void xbox_360_dreams white_door_bsp skybox; do
            if ! grep "\[interloper\] dimension interloper:$dim -> ok" server.log > /dev/null; then
              grep "\[interloper\] dimension" server.log | head -5 | while IFS= read -r l; do
                echo "::warning title=log::$(echo "$l" | head -c 900)"
              done
              echo "::error title=dimension::interloper:$dim is missing at runtime"
              exit 1
            fi
            echo "dimension ok: interloper:$dim"
          done
          if grep -q -E "Parsing error loading recipe|Couldn't parse recipe|Failed to load advancement|Missing loot table" server.log; then
            echo "::error title=datapack::a recipe or advancement of this mod failed to load"
            grep -n -E "Parsing error loading recipe|Couldn't parse recipe|Failed to load advancement|Missing loot table" server.log | head -5
            exit 1
          fi
          echo "::notice title=2.2.0::street, graffiti, ravencheck, void probe, dm editor, sourcebox and skybox all loaded"
          if grep -q -E "Couldn't parse|Failed to parse|Unable to load|Unknown dimension|datapack" server.log; then
            echo "::warning title=datapack::datapack warnings found in the server log"
            grep -n -E "Couldn't parse|Failed to parse|Unable to load|Unknown dimension" server.log | head -5
          fi

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
          if-no-files-found: ignore
